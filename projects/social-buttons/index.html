<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Sign-In Buttons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .social-buttons-wrapper {
            max-width: 320px;
            width: 100%;
        }

        .social-btn {
            display: flex;
            align-items: center;
            width: 100%;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .social-btn:hover {
            opacity: 0.9;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            font-size: 18px;
            flex-shrink: 0;
        }

        .social-text {
            flex: 1;
            text-align: left;
            padding: 12px 18px;
        }

        /* Bitbucket - Dark Navy */
        .btn-bitbucket { background-color: #205081; }
        .btn-bitbucket .social-icon { background-color: #1a4067; }

        /* Dropbox - Light Blue */
        .btn-dropbox { background-color: #4ba9ea; }
        .btn-dropbox .social-icon { background-color: #3d8ec5; }

        /* Facebook - Facebook Blue */
        .btn-facebook { background-color: #3b5998; }
        .btn-facebook .social-icon { background-color: #2d4373; }

        /* Flickr - Pink */
        .btn-flickr { background-color: #ea1379; }
        .btn-flickr .social-icon { background-color: #c10f64; }

        /* GitHub - Dark */
        .btn-github { background-color: #333333; }
        .btn-github .social-icon { background-color: #1a1a1a; }

        /* Google - Red */
        .btn-google { background-color: #dd4b39; }
        .btn-google .social-icon { background-color: #b73525; }
    </style>
</head>
<body>
    <div class="social-buttons-wrapper">
        <button class="social-btn btn-bitbucket">
            <span class="social-icon"><i class="fab fa-bitbucket"></i></span>
            <span class="social-text">Sign in with Bitbucket</span>
        </button>

        <button class="social-btn btn-dropbox">
            <span class="social-icon"><i class="fab fa-dropbox"></i></span>
            <span class="social-text">Sign in with Dropbox</span>
        </button>

        <button class="social-btn btn-facebook">
            <span class="social-icon"><i class="fab fa-facebook-f"></i></span>
            <span class="social-text">Sign in with Facebook</span>
        </button>

        <button class="social-btn btn-flickr">
            <span class="social-icon"><i class="fab fa-flickr"></i></span>
            <span class="social-text">Sign in with Flickr</span>
        </button>

        <button class="social-btn btn-github">
            <span class="social-icon"><i class="fab fa-github"></i></span>
            <span class="social-text">Sign in with GitHub</span>
        </button>

        <button class="social-btn btn-google">
            <span class="social-icon"><i class="fab fa-google-plus-g"></i></span>
            <span class="social-text">Sign in with Google</span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
