<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f7f8fc;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .pricing-wrapper {
            max-width: 900px;
            width: 100%;
        }

        .pricing-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
        }

        .price-card {
            background: #fff;
            border-radius: 10px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            flex: 1;
            max-width: 280px;
            position: relative;
        }

        .price-card.featured {
            background: #6c63ff;
            color: #fff;
            padding: 50px 25px;
            z-index: 2;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(108, 99, 255, 0.3);
        }

        .plan-name {
            font-size: 18px;
            font-weight: 600;
            color: #444;
            margin-bottom: 20px;
        }

        .price-card.featured .plan-name {
            color: #fff;
        }

        .plan-price {
            font-size: 38px;
            font-weight: 700;
            color: #2d2d2d;
            margin-bottom: 25px;
        }

        .price-card.featured .plan-price {
            color: #fff;
            font-size: 42px;
        }

        .features-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }

        .features-list li {
            padding: 14px 0;
            color: #555;
            font-size: 14px;
            border-bottom: 1px solid #eee;
        }

        .features-list li:last-child {
            border-bottom: none;
        }

        .price-card.featured .features-list li {
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .learn-more-btn {
            background: #6c63ff;
            color: #fff;
            border: none;
            padding: 10px 30px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .learn-more-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .price-card.featured .learn-more-btn {
            background: #fff;
            color: #6c63ff;
        }

        @media (max-width: 768px) {
            .pricing-row {
                flex-direction: column;
                gap: 20px;
            }

            .price-card.featured {
                transform: scale(1);
            }

            .price-card {
                max-width: 100%;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="pricing-wrapper">
        <div class="pricing-row">
            <div class="price-card">
                <h3 class="plan-name">Basic</h3>
                <div class="plan-price">$199.99</div>
                <ul class="features-list">
                    <li>500 GB Storage</li>
                    <li>2 Users Allowed</li>
                    <li>Send up to 3 GB</li>
                </ul>
                <button class="learn-more-btn">Learn More</button>
            </div>

            <div class="price-card featured">
                <h3 class="plan-name">Professional</h3>
                <div class="plan-price">$249.99</div>
                <ul class="features-list">
                    <li>1 TB Storage</li>
                    <li>5 Users Allowed</li>
                    <li>Send up to 10 GB</li>
                </ul>
                <button class="learn-more-btn">Learn More</button>
            </div>

            <div class="price-card">
                <h3 class="plan-name">Master</h3>
                <div class="plan-price">$399.99</div>
                <ul class="features-list">
                    <li>2 TB Storage</li>
                    <li>10 Users Allowed</li>
                    <li>Send up to 20 GB</li>
                </ul>
                <button class="learn-more-btn">Learn More</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
