<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Popups</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      padding: 40px 20px;
    }

    .notifications-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 520px;
    }

    /* ── Base Notification ── */
    .notif {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1.5px solid transparent;
      position: relative;
    }

    /* ── Icon Circle ── */
    .notif-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2.5px solid currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    /* ── Text ── */
    .notif-text {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 700;
    }

    /* ── Close Button ── */
    .notif-close {
      background: none;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* ══ SUCCESS (red/pink) ══ */
    .notif-success {
      background-color: #f8d7da;
      border-color: #f0b8bd;
      color: #c0393d;
    }
    .notif-success .notif-close { color: #e05055; }

    /* ══ ERROR (green) ══ */
    .notif-error {
      background-color: #d4edda;
      border-color: #b8dfc2;
      color: #3a8c4e;
    }
    .notif-error .notif-icon {
      border-color: #3a8c4e;
    }
    .notif-error .notif-close { color: #5aaa6a; }

    /* ══ INFO (blue) ══ */
    .notif-info {
      background-color: #cce5ff;
      border-color: #b0d4f5;
      color: #4a86c0;
    }
    .notif-info .notif-close { color: #6a9fc8; }

    /* ══ WARNING (gray) ══ */
    .notif-warning {
      background-color: #e2e3e5;
      border-color: #d0d1d3;
      color: #6c757d;
    }
    .notif-warning .notif-close { color: #8a9099; }
  </style>
</head>
<body>

  <div class="notifications-wrap">

    <!-- SUCCESS -->
    <div class="notif notif-success">
      <div class="notif-icon">
        <i class="fa-solid fa-circle-info"></i>
      </div>
      <span class="notif-text">This is a success notification popup</span>
      <button class="notif-close">&#10005;</button>
    </div>

    <!-- ERROR -->
    <div class="notif notif-error">
      <div class="notif-icon">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <span class="notif-text">This is a error notification popup</span>
      <button class="notif-close">&#10005;</button>
    </div>

    <!-- INFO -->
    <div class="notif notif-info">
      <div class="notif-icon">
        <i class="fa-solid fa-ban"></i>
      </div>
      <span class="notif-text">This is a info notification popup</span>
      <button class="notif-close">&#10005;</button>
    </div>

    <!-- WARNING -->
    <div class="notif notif-warning">
      <div class="notif-icon">
        <i class="fa-solid fa-check"></i>
      </div>
      <span class="notif-text">This is a warning notification popup</span>
      <button class="notif-close">&#10005;</button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll('.notif-close').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.closest('.notif').style.display = 'none';
      });
    });
  </script>
</body>
</html>
