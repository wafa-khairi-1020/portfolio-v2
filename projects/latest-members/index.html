<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latest Members</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #c8c8c8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      padding: 40px 20px;
    }

    /* ── Widget Shell ── */
    .widget {
      width: 490px;
      background-color: #3e3e3e;
      border-radius: 6px;
      overflow: hidden;
      color: #fff;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }

    /* ── Header ── */
    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
    }

    .widget-header h6 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-new {
      background-color: #e03535;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #bbb;
      font-size: 1rem;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .ctrl-btn:hover { color: #fff; }

    /* ── Members Grid ── */
    .members-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px 4px;
      padding: 16px 12px 12px;
    }

    .member-item { text-align: center; padding: 4px 2px; }

    .member-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      display: block;
      margin: 0 auto 9px;
    }

    .member-name {
      font-size: 0.8rem;
      font-weight: 500;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .member-date {
      font-size: 0.72rem;
      color: #999;
      margin-top: 2px;
    }

    /* ── Footer ── */
    .widget-footer {
      padding: 15px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .widget-footer a {
      color: #4da8ff;
      text-decoration: none;
      font-size: 0.88rem;
    }
    .widget-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="widget">

    <!-- Header -->
    <div class="widget-header">
      <h6>Latest Members</h6>
      <div class="header-right">
        <span class="badge-new">8 New Members</span>
        <button class="ctrl-btn" title="Minimize">&#8722;</button>
        <button class="ctrl-btn" title="Close">&#10005;</button>
      </div>
    </div>

    <!-- Grid -->
    <div class="members-grid">

      <!-- Row 1 -->
      <div class="member-item">
        <img class="member-avatar"
             src="https://randomuser.me/api/portraits/men/32.jpg"
             alt="Alexander">
        <div class="member-name">Alexander Pie...</div>
        <div class="member-date">Today</div>
      </div>

      <div class="member-item">
        <img class="member-avatar"
             src="https://randomuser.me/api/portraits/men/46.jpg"
             alt="Norman">
        <div class="member-name">Norman</div>
        <div class="member-date">Yesterday</div>
      </div>

      <div class="member-item">
        <img class="member-avatar"
             src="https://randomuser.me/api/portraits/women/65.jpg"
             alt="Jane">
        <div class="member-name">Jane</div>
        <div class="member-date">12 Jan</div>
      </div>

      <div class="member-item">
        <img class="member-avatar"
             src="https://randomuser.me/api/portraits/men/71.jpg"
             alt="John">
        <div class="member-name">John</div>
        <div class="member-date">12 Jan</div>
      </div>

      <!-- Row 2 -->
      <div class="member-item">
        <img class="member-avatar"
             src="https://randomuser.me/api/portraits/men/55.jpg"
             alt="Alexander">
        <div class="member-name">Alexander</div>
        <div class="member-date">13 Jan</div>
      </div>

      <div class="member-item">
        <img class="member-avatar"
             src="https://randomuser.me/api/portraits/women/44.jpg"
             alt="Sarah">
        <div class="member-name">Sarah</div>
        <div class="member-date">14 Jan</div>
      </div>

      <div class="member-item">
        <img class="member-avatar"
             src="https://randomuser.me/api/portraits/women/22.jpg"
             alt="Nora">
        <div class="member-name">Nora</div>
        <div class="member-date">15 Jan</div>
      </div>

      <div class="member-item">
        <img class="member-avatar"
             src="https://randomuser.me/api/portraits/women/14.jpg"
             alt="Nadia">
        <div class="member-name">Nadia</div>
        <div class="member-date">15 Jan</div>
      </div>

    </div>

    <!-- Footer -->
    <div class="widget-footer">
      <a href="#">View All Users</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
