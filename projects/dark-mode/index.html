<!DOCTYPE html>
<html lang="fa" dir="rtl"
      x-data="darkMode()"
      :class="{ 'dark': darkMode }">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Countdown</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Alpine -->
    <script defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.11/dist/cdn.min.js">
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="main.css">

</head>

<body>

    <!-- DARK MODE -->
    <div class="container pt-4">

        <div class="d-flex justify-content-end">

            <div class="d-flex align-items-center gap-3">

                <i class="bi bi-brightness-high-fill fs-4 dark-text-white"></i>

                <div class="form-check form-switch">

                    <input class="form-check-input darkmode-switch"
                           type="checkbox"
                           x-model="darkMode">

                </div>

                <i class="bi bi-moon-stars-fill fs-5 dark-text-black"></i>

            </div>

        </div>

    </div>





    <!-- MAIN -->
    <div class="container">

        <div class="row
                    justify-content-center
                    align-items-center
                    text-center
                    main-box">

            <div class="col-lg-8">

                <!-- TITLE -->
                <h2 class="fw-bold text-white mb-4">

                    <span class="text-primary">
                        وب سایت
                    </span>

                    <span id="text">
                        شرکت نفت
                    </span>

                </h2>

                <p class="text-white mb-5">

                    اینجا از ما می‌توانید خرید کنید
                    حضوری و غیر حضوری

                </p>





                <!-- COUNTER -->
                <div class="d-flex
                            justify-content-center
                            gap-3
                            flex-wrap
                            mb-5">

                    <div class="counter-box d-flex flex-column justify-content-center">

                        <h2 id="days">00</h2>

                        <span>روز</span>

                    </div>

                    <div class="counter-box d-flex flex-column justify-content-center">

                        <h2 id="hours">00</h2>

                        <span>ساعت</span>

                    </div>

                    <div class="counter-box d-flex flex-column justify-content-center">

                        <h2 id="minutes">00</h2>

                        <span>دقیقه</span>

                    </div>

                    <div class="counter-box d-flex flex-column justify-content-center">

                        <h2 id="seconds">00</h2>

                        <span>ثانیه</span>

                    </div>

                </div>





                <!-- INPUT -->
                <div class="row justify-content-center">

                    <div class="col-md-7">

                        <div class="input-group">

                            <button class="btn btn-primary px-4">

                                عضویت

                            </button>

                            <input type="email"
                                   class="form-control subscribe-input"
                                   placeholder="ایمیل خود را وارد کنید">

                        </div>

                    </div>

                </div>





                <!-- SOCIAL -->
                <div class="d-flex justify-content-center gap-3 mt-5">

                    <a href="#" class="social-icon">
                        <i class="bi bi-linkedin"></i>
                    </a>

                    <a href="#" class="social-icon">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="#" class="social-icon">
                        <i class="bi bi-facebook"></i>
                    </a>

                    <a href="#" class="social-icon">
                        <i class="bi bi-twitter"></i>
                    </a>

                </div>

            </div>

        </div>

    </div>
     <!-- CONTACT -->
    <section class="contact-section py-5">

        <div class="container">

            <!-- TITLE -->
            <div class="text-center mb-5">

                <h1 class="fw-bold title-contact">

                    ارتباط با ما

                </h1>

                <div class="title-line mx-auto"></div>

            </div>





            <div class="row g-4">

                <!-- FORM -->
                <div class="col-lg-7">

                    <div class="contact-box p-4">

                        <form>

                            <div class="row">

                                <!-- NAME -->
                                <div class="col-md-6 mb-4">

                                    <label class="form-label fw-bold">

                                        نام :

                                    </label>

                                    <input type="text"
                                           class="form-control custom-input">

                                </div>

                                <!-- EMAIL -->
                                <div class="col-md-6 mb-4">

                                    <label class="form-label fw-bold">

                                        ایمیل :

                                    </label>

                                    <input type="email"
                                           class="form-control custom-input">

                                </div>

                            </div>





                            <!-- SUBJECT -->
                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    موضوع :

                                </label>

                                <input type="text"
                                       class="form-control custom-input">

                            </div>





                            <!-- MESSAGE -->
                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    متن پیام :

                                </label>

                                <textarea class="form-control custom-textarea"
                                          rows="8"></textarea>

                            </div>





                            <!-- BUTTON -->
                            <div class="text-center">

                                <button class="btn btn-primary px-4">

                                    ارسال پیام

                                </button>

                            </div>

                        </form>

                    </div>

                </div>





                <!-- INFO -->
                <div class="col-lg-5">

                    <div class="contact-box p-4 text-center">

                        <!-- ADDRESS -->
                        <div class="mb-4">

                            <h4 class="fw-bold">

                                آدرس:

                                <i class="bi bi-geo-alt me-2"></i>

                            </h4>

                            <p>

                                لورم ایپسوم متن ساختگی با تولید سادگی نامفهوم

                            </p>

                        </div>





                        <!-- EMAIL -->
                        <div class="mb-4">

                            <h4 class="fw-bold">

                                ایمیل:

                                <i class="bi bi-envelope me-2"></i>

                            </h4>

                            <p>

                                info@example.com

                            </p>

                        </div>





                        <!-- PHONE -->
                        <div class="mb-4">

                            <h4 class="fw-bold">

                                شماره تماس :

                                <i class="bi bi-phone me-2"></i>

                            </h4>

                            <p>

                                09100000000

                            </p>

                        </div>





                        <!-- MAP -->
                        <div class="map-box">

                            <iframe
                                src="https://maps.google.com/maps?q=tehran&t=&z=13&ie=UTF8&iwloc=&output=embed"
                                width="100%"
                                height="280"
                                style="border:0;"
                                allowfullscreen=""
                                loading="lazy">
                            </iframe>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>



    
     











    <!-- COUNTDOWN -->
    <script>

        const targetDate =
        new Date("2026-12-31 00:00:00").getTime();

        setInterval(() => {

            const now =
            new Date().getTime();

            const distance =
            targetDate - now;

            const days =
            Math.floor(distance / (1000 * 60 * 60 * 24));

            const hours =
            Math.floor((distance %
            (1000 * 60 * 60 * 24))
            / (1000 * 60 * 60));

            const minutes =
            Math.floor((distance %
            (1000 * 60 * 60))
            / (1000 * 60));

            const seconds =
            Math.floor((distance %
            (1000 * 60))
            / 1000);

            document.getElementById("days").innerHTML =
            days;

            document.getElementById("hours").innerHTML =
            hours;

            document.getElementById("minutes").innerHTML =
            minutes;

            document.getElementById("seconds").innerHTML =
            seconds;

        }, 1000);

    </script>





    <!-- ITYPED -->
    <script src="https://unpkg.com/ityped@1.0.3"></script>

    <script>

        const textElement =
        document.querySelector('#text');

        ityped.init(textElement, {

            strings: [

                'شرکت نفت',
                'شرکت صنعتی',
                'شرکت تجارتی'

            ],

            typeSpeed: 120,

            backSpeed: 80,

            loop: true

        });

    </script>





    <!-- DARK MODE -->
    <script>

        document.addEventListener('alpine:init', () => {

            Alpine.data('darkMode', () => ({

                darkMode: false,

                init() {

                    if (localStorage.theme === 'dark') {

                        this.darkMode = true;

                        document.documentElement
                        .classList.add('dark');

                    }

                    this.$watch('darkMode', (value) => {

                        if (value) {

                            localStorage.theme = 'dark';

                            document.documentElement
                            .classList.add('dark');

                        } else {

                            localStorage.theme = 'light';

                            document.documentElement
                            .classList.remove('dark');

                        }

                    });

                }

            }));

        });

    </script>

</body>

</html>
