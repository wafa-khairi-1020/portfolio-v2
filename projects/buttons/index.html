<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      padding: 40px 20px;
    }

    .btn-group-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* ── Base Button ── */
    .btn-custom {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      transition: filter 0.15s;
      min-width: 140px;
      justify-content: flex-start;
    }
    .btn-custom:hover { filter: brightness(0.9); }

    /* Icon side badge */
    .btn-custom .btn-icon {
      background-color: rgba(0,0,0,0.18);
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    /* ── Colors ── */
    .btn-green    { background-color: #5cb85c; }
    .btn-red      { background-color: #d9534f; }
    .btn-orange   { background-color: #e8a020; }
    .btn-teal     { background-color: #5bc0c0; }
    .btn-blue     { background-color: #428bca; }
    .btn-crimson  { background-color: #c0392b; }
    .btn-info     { background-color: #5bc0de; }

    /* ── Outline (Left / Right) ── */
    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 2px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      color: #555;
      background-color: #fff;
      transition: background-color 0.15s;
      min-width: 120px;
      justify-content: center;
    }
    .btn-outline:hover { background-color: #f0f0f0; }
  </style>
</head>
<body>

  <div class="btn-group-wrap">

    <!-- Row 1: Success | Cancel -->
    <div class="btn-row">
      <button class="btn-custom btn-green">
        <span class="btn-icon"><i class="fa-solid fa-check"></i></span>
        Success
      </button>
      <button class="btn-custom btn-red">
        <span class="btn-icon"><i class="fa-solid fa-xmark"></i></span>
        Cancel
      </button>
    </div>

    <!-- Row 2: Bookmark | Camera -->
    <div class="btn-row">
      <button class="btn-custom btn-orange">
        <span class="btn-icon"><i class="fa-solid fa-bookmark"></i></span>
        Bookmark
      </button>
      <button class="btn-custom btn-teal">
        <span class="btn-icon"><i class="fa-solid fa-camera"></i></span>
        Camera
      </button>
    </div>

    <!-- Row 3: Left | Right (outline) -->
    <div class="btn-row">
      <button class="btn-outline">
        <i class="fa-solid fa-chevron-left"></i>
        Left
      </button>
      <button class="btn-outline">
        Right
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- Row 4: Thumbs Up | Thumbs Down -->
    <div class="btn-row">
      <button class="btn-custom btn-green">
        <span class="btn-icon"><i class="fa-solid fa-thumbs-up"></i></span>
        Thumbs Up
      </button>
      <button class="btn-custom btn-crimson">
        <span class="btn-icon"><i class="fa-solid fa-thumbs-down"></i></span>
        Thumbs Down
      </button>
    </div>

    <!-- Row 5: Refresh | Trash -->
    <div class="btn-row">
      <button class="btn-custom btn-blue">
        <span class="btn-icon"><i class="fa-solid fa-arrows-rotate"></i></span>
        Refresh
      </button>
      <button class="btn-custom btn-red">
        <span class="btn-icon"><i class="fa-solid fa-trash"></i></span>
        Trash
      </button>
    </div>

    <!-- Row 6: Info Web -->
    <div class="btn-row">
      <button class="btn-custom btn-info">
        <span class="btn-icon"><i class="fa-solid fa-circle-info"></i></span>
        Info Web
      </button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
